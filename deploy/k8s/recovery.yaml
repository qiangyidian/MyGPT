# Recovery scheduler Deployment + PodDisruptionBudget.
#
# Runs RecoveryScheduler.scan() on a schedule: finds runs whose lease expired
# (or legacy `running` rows with no lease), requeues retryable runs, terminally
# fails exhausted ones. Single replica is sufficient (it only requeues; it does
# not execute runs).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery
  namespace: mygpt
  labels:
    app.kubernetes.io/name: mygpt
    app.kubernetes.io/component: recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mygpt
      app.kubernetes.io/component: recovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mygpt
        app.kubernetes.io/component: recovery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: recovery
          image: mygpt/backend:v1.0.0   # same image as the API
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mygpt-config
            - secretRef:
                name: mygpt-secrets
          command: ["python", "-m", "app.recovery"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recovery-pdb
  namespace: mygpt
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mygpt
      app.kubernetes.io/component: recovery
