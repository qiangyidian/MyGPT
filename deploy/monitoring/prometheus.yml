# Prometheus scrape config for the MyGPT compose topology (finding 38).
#
# Mount read-only into the prometheus container (see docker-compose.prod.yml).
#
# Why the API is scraped over the network with a bearer token instead of the
# /metrics endpoint being left anonymous:
#   * the backend publishes 127.0.0.1 only, so nothing reaches /metrics from
#     outside the compose network anyway;
#   * the exposition carries route templates, provider/model label values and
#     queue depth. That is reconnaissance material, so config.py refuses to boot
#     a non-dev deployment with PROMETHEUS_ENABLED=true and METRICS_TOKEN empty.
#   * a sidecar (a second container scraping localhost and publishing 9090) was
#     the alternative; it costs an extra image per replica and a
#     shared-network assumption, and buys nothing here because the scrape is
#     already inside the private compose network.
#
# METRICS_TOKEN is expanded by Prometheus from its own environment at load time
# (prometheus supports `$VAR` in the config), so the token stays in .env.prod and
# never lands in this file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: mygpt

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: mygpt-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: "$METRICS_TOKEN"
    static_configs:
      # `backend` is the compose service name; replicated rollouts (compose
      # scale / k8s) would move to service-discovery here (http_sd_configs or a
      # Prometheus Operator ServiceMonitor). The k8s manifests are in deploy/k8s/.
      - targets: ["backend:8000"]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
