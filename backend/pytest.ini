[pytest]
asyncio_mode = auto
# The test database is one shared in-memory SQLite connection and several
# session-scoped async fixtures / service locks live across tests. Keep tests
# and async fixtures on the same loop so pytest-asyncio does not close or
# replace that connection between function-scoped loops.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
