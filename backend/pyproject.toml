[project]
name = "mygpt-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness-first default set (E/F + common bugbear/pyupgrade). Stylistic
# rules that fight patterns deliberately used throughout this codebase are
# ignored below — each with the reason, so re-enabling later is a decision,
# not an accident.
#
# NOTE: this config is pinned to ruff==0.15.17 in .github/workflows/ci.yml.
# Floating the ruff version breaks the gate whenever upstream removes a rule
# (PLB003 / UP038 / BLE001 all vanished in recent releases) — a red CI also
# blocks the deploy signal, so lint changes ride the pin deliberately.
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "TRY", "C4", "RET", "PL"]
ignore = [
    # FastAPI's canonical pattern: Depends(...) in parameter defaults.
    "B008",
    # Deliberate "best-effort, never raise" guards around logging/audit/quota
    # side channels (documented in each site).
    "S110",
    # Legacy stylistic debt: kept as-is until a dedicated cleanup pass.
    "RUF012",
    "RUF022",
    "RUF059",
    "F841",
    "TRY401",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY300",
    "TRY301",
    "TRY002",
    "TRY003",
    "SIM103",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM115",
    "SIM117",
    "RET504",
    "RET505",
    "RET507",
    "RET508",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLW1510",
    "PLW2901",
    "PLR5501",
    "C408",
    # Deliberate lazy imports: the codebase imports heavy/optional deps
    # (crewai, providers, DB-bound modules) inside functions to keep import
    # cycles out and cold-start fast. Top-level-only imports would regress both.
    "PLC0415",
    # zh-CN product: full-width punctuation（，：）in strings/comments/docs is
    # intentional copy, not "ambiguous ASCII".
    "RUF001",
    "RUF002",
    "RUF003",
    # Legacy long lines predate the 100-col budget; reflow in a dedicated
    # formatting pass, not piecemeal.
    "E501",
    # Late module-level imports after settings/env bootstrap (circular-import
    # avoidance, same family as PLC0415).
    "E402",
    # Module-level singleton/guard state (_queue_singleton, sanitizer-installed
    # flags) is an accepted pattern here; module __getattr__ refactors are not
    # worth the churn.
    "PLW0603",
    # Legacy `raise ... from` hygiene debt inside except blocks; batch-fix in a
    # dedicated pass (same bucket as the TRY ignores above).
    "B904",
    # Enum,Str mro → StrEnum migration changes class layout for serialized
    # enums; not worth the pre-deploy risk. Revisit with a dedicated pass.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point; long fixtures are fine. Also tolerated there:
# star-import model registration (conftest), semicolon-packed arrange lines,
# fire-and-forget tasks, zip strictness, lambda wrappers, and raw test-copy
# regexes — brevity beats strictness in test code.
"tests/*" = [
    "B011", "B017", "PLW0603",
    "F403", "E702", "RUF006", "PLW0108", "RUF043", "B905", "B007",
]

[tool.ruff.lint.mccabe]
max-complexity = 20
