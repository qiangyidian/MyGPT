name: Deploy Signal

# CI (ci.yml) 全绿且不可变镜像已经推送到 GHCR 后，才发部署信号。
# 服务器 systemd timer 轮询 deploy 分支，拉取对应 SHA 镜像后部署。
#
# 服务器侧组件（已在本机部署）：
#   /usr/local/bin/mychat-deploy.sh          部署+回滚脚本
#   mychat-deploy.timer / .service           systemd 轮询单元

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mychat-production-deploy-signal
  cancel-in-progress: false

jobs:
  signal:
    # CI 通过后才发部署信号；手动绕过 CI 不再受支持。
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Push deploy signal
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          SIGNAL="deploy-requested-$(date -u +%Y%m%dT%H%M%SZ)"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          # Full main history is used only to prevent an older CI run that
          # finishes late from replacing a newer deploy signal.
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            git fetch --unshallow origin main
          else
            git fetch origin main
          fi
          git fetch origin deploy --depth 1
          CURRENT_SIGNAL_SHA=$(git show FETCH_HEAD:SIGNAL 2>/dev/null | awk '$1 == "commit:" {print $2; exit}' || true)
          if [[ "$CURRENT_SIGNAL_SHA" =~ ^[0-9a-f]{40}$ ]] && \
             git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_SIGNAL_SHA"; then
            echo "A newer commit already has a deploy signal: $CURRENT_SIGNAL_SHA"
            exit 0
          fi
          git fetch origin deploy --depth 1
          git checkout -B deploy FETCH_HEAD
          echo "${SIGNAL}" > SIGNAL
          echo "commit: ${TARGET_SHA}" >> SIGNAL
          echo "actor:  ${{ github.actor }}" >> SIGNAL
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add SIGNAL
          git commit -m "deploy: ${TARGET_SHA}" --allow-empty
          # force-with-lease：信号分支是单向追加，远端若在我们 fetch 后又
          # 更新（并发信号），以远端为准放弃本次（下一个 commit 会再触发）。
          git push --force-with-lease=deploy:FETCH_HEAD origin deploy
